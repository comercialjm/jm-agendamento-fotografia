spring:
  application:
    name: jm-agendamento

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/jm_agendamento}
    username: ${DB_USERNAME:jm_local_admin}
    password: ${DB_PASSWORD}

  flyway:
    locations: classpath:db/migration

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
